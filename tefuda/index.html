<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="手札">
<meta name="theme-color" content="#e0862f">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>手札</title>
<style>
  :root { --ink:#1a1a1a; --ink2:#5a5a5a; --bg:#f7f5ee; --paper:#fffdf6; --line:#d8d2bf; --accent:#e0862f; --soft:#f8e6d3; --ok:#2e8b57; --oksoft:#e2f3e8; --ng:#c83a2c; --ngsoft:#f6dcd6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; line-height:1.6; }
  #app { max-width:640px; margin:0 auto; padding:12px 14px 96px; }
  main.onb h1 { font-size:34px; margin:24px 0 6px; }
  .lede { color:var(--ink2); margin:0 0 18px; }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:12px 0; box-shadow:0 6px 18px rgba(0,0,0,.05); }
  .card h2 { font-size:18px; margin:0 0 10px; } .card h3 { font-size:15px; margin:14px 0 8px; color:var(--ink2); }
  .head { padding:8px 4px 0; }
  .gain { font-size:18px; } .gain b { color:var(--accent); font-size:26px; }
  .sub { color:var(--ink2); font-size:13px; }
  .switch { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--ink2); margin-top:8px; }
  .exp .tag { font-size:12px; color:var(--accent); font-weight:700; letter-spacing:.08em; }
  .exp .act { font-size:22px; font-weight:800; margin:6px 0; }
  .exp .lens { display:flex; flex-direction:column; gap:2px; margin-bottom:12px; } .lens b { font-size:16px; } .lens .how { color:var(--ink2); } .lens .src { font-size:12px; color:#8a8a8a; }
  button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:12px; padding:10px 14px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:800; width:100%; }
  button.primary.big { font-size:24px; padding:22px; border-radius:18px; }
  button.primary:disabled { opacity:.4; }
  button.ghost { background:transparent; } button.danger { border-color:var(--ng); color:var(--ng); width:100%; margin-top:8px; }
  button.choice { flex:1; padding:14px; font-weight:700; } button.choice.sel { background:var(--soft); border-color:var(--accent); }
  button.mini { font-size:11px; padding:2px 8px; border-radius:999px; }
  .row { display:flex; gap:8px; margin:8px 0; } .row.wrap { flex-wrap:wrap; } .row input { flex:1; }
  input[type=text], input:not([type]), select, textarea { font:inherit; width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; margin:6px 0; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:10px 6px; border-bottom:1px dashed var(--line); } .opt.small { font-size:13px; color:var(--ink2); flex-direction:column; }
  .opt .small { display:block; color:var(--ink2); font-size:13px; }
  .small { font-size:13px; color:var(--ink2); }
  .why { font-size:13px; color:var(--ink2); background:#f3efe3; border-radius:8px; padding:8px 10px; margin:6px 0 10px; }
  .lbl { font-size:12px; color:var(--ink2); letter-spacing:.06em; margin-top:8px; }
  .steps { padding-left:20px; margin:0; } .steps li { margin:6px 0; }
  .intro h2 { font-size:16px; } .note { font-size:13px; color:var(--ink2); margin:8px 0 0; }
  .progress { font-weight:800; margin:18px 0 6px; } .purpose { font-size:13px; color:var(--ink2); margin-bottom:4px; }
  .opt.btn { width:100%; text-align:left; flex-direction:column; gap:2px; background:#fff; border:1px solid var(--line); border-radius:12px; margin:8px 0; padding:12px 14px; font-size:16px; position:relative; }
  .opt.btn:not(.star)::after { content:"›"; position:absolute; right:14px; top:12px; font-size:22px; color:var(--ink2); }
  .opt.btn.done { border-color:var(--ok); } .opt.btn.star { flex-direction:row; align-items:flex-start; gap:8px; margin:4px 0; padding:10px 12px; } .opt.btn.star .mark { font-size:20px; line-height:1.2; flex:0 0 auto; }
  .opt.btn.star .body { flex:1; display:block; } .opt.btn.star.on { background:var(--soft); border-color:var(--accent); } .opt.btn.star .small { display:block; }
  .chip.mine { border-style:dashed; } .grp { margin:10px 0 0; font-weight:700; } .rateText button.mini { margin-left:6px; vertical-align:middle; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; } .chip { padding:8px 12px; border-radius:999px; font-size:14px; } .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  textarea#mAns { width:100%; font-size:17px; line-height:1.6; }
  .facet { padding:10px 0; border-bottom:1px dashed var(--line); } .facet b { display:block; margin-bottom:2px; } .facet.dim { opacity:.6; } .facet .small { display:block; margin-top:2px; }
  .poss { padding:10px 0; border-bottom:1px dashed var(--line); } .poss .tag { font-size:11px; color:var(--accent); font-weight:700; letter-spacing:.06em; } .poss .row button { padding:8px; }
  .card.snap { border-left:5px solid var(--accent); } .card.snap p { margin:4px 0; }
  .card.ai { background:#eef4ff; border-color:#c9d8f5; } .opt.btn.ai { border-color:#7d9be0; } .opt.btn.cand { border-color:var(--accent); } .opt.btn.cand::after { content:"↓"; }
  .opt.btn.skipped { opacity:.55; border-style:dashed; } .opt.btn.skipped a { color:var(--accent); }
  .opt.btn.skipped::after { content:""; }
  button.ghost.small { width:100%; margin-top:10px; font-size:13px; color:var(--ink2); border-style:dashed; }
  .rateRow { padding:10px 0; border-bottom:1px dashed var(--line); } .rateText { margin-bottom:6px; }
  .rateBtns { display:flex; gap:4px; } .rb { flex:1; padding:8px 0; font-size:14px; border-radius:8px; min-width:0; } .rb.on { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:800; }
  .flash { position:sticky; top:8px; z-index:5; padding:10px 14px; border-radius:12px; font-weight:700; margin-bottom:8px; }
  .flash.ok { background:var(--oksoft); color:var(--ok); } .flash.ng { background:var(--ngsoft); color:var(--ng); }
  .okaeri { background:var(--soft); border-radius:12px; padding:10px 14px; font-weight:700; color:var(--accent); }
  .mitate { background:#f3ecff; border-color:#d9c8ff; } .road { font-size:14px; color:var(--ink2); }
  .treebox svg { width:100%; height:auto; display:block; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
  .tile { border:2px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13px; display:flex; flex-direction:column; gap:2px; background:#fff; }
  .tile span { color:var(--ink2); font-size:11px; }
  .tile.un { opacity:.55; border-style:dashed; } .tile.yes { border-color:var(--ok); background:var(--oksoft); } .tile.no { border-color:#bbb; background:#eee; } .tile.now { border-color:var(--accent); background:var(--soft); } .tile.tried { border-color:#999; }
  .tallyrow { padding:8px 0; border-bottom:1px dashed var(--line); } .ev { margin-top:4px; } .fav { font-size:16px; }
  .word { padding:6px 0; border-bottom:1px dashed var(--line); }
  nav.tabs { position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--paper); border-top:1px solid var(--line); padding:6px 0 max(8px, env(safe-area-inset-bottom)); }
  nav.tabs button { flex:1; border:0; background:transparent; border-radius:0; display:flex; flex-direction:column; align-items:center; font-size:11px; color:var(--ink2); padding:4px 0; }
  nav.tabs button span { font-size:22px; line-height:1.1; } nav.tabs button.on { color:var(--accent); font-weight:800; }
</style>
</head>
<body>
<div id="app"></div>
<script src="./app.js"></script>
</body>
</html>
