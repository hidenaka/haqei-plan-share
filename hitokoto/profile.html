<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>わたしの取扱説明書</title>
<style>
:root{--ink:#3b3630;--ink2:#96908a;--bg:#faf7f2;--card:#fff;--line:#ece6dd;--ac:#7a9e7e;--ac2:#c98a5e;--blue:#7d95b5;--rose:#c4838f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.75;padding-bottom:40px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header b{font-size:16px}
header a{font-size:13px;color:var(--ac);text-decoration:none}
.wrap{max-width:600px;margin:0 auto;padding:14px}
.summary{background:#3a4a3c;color:#f2efe9;border-radius:16px;padding:18px;font-size:15px;margin-bottom:6px}
.meta{font-size:12px;color:var(--ink2);text-align:center;margin:8px 0 14px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.sec h2{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.sec h2 span{font-size:20px}
.item{padding:10px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:none}
.pt{font-size:14.5px;display:flex;gap:7px;align-items:flex-start}
.pt .cf{flex-shrink:0;margin-top:4px;font-size:10px;font-weight:800;border-radius:5px;padding:0 6px;line-height:1.7}
.cf.strong{background:#e7efe8;color:var(--ac)}
.cf.medium{background:#f0ece4;color:var(--ink2)}
.cf.new{background:#fbeee4;color:var(--ac2)}
.evd{font-size:12px;color:var(--ink2);margin:4px 0 0 3px;padding-left:10px;border-left:2.5px solid var(--line)}
.empty{color:var(--ink2);font-size:13.5px;text-align:center;padding:26px 0}
.foot{font-size:12px;color:var(--ink2);text-align:center;margin-top:18px;line-height:1.9}
</style>
</head>
<body>
<header><b>わたしの取扱説明書</b><a href="index.html">← まどか</a></header>
<div class="wrap">
  <div id="body"><div class="empty">読み込み中…</div></div>
  <p class="foot">まどかとの会話から、実際に話したことだけを根拠に書かれています。<br>毎週日曜の朝、新しい会話で洗練されます。<br><a href="growth.html" style="color:var(--ac)">📍 成長の現在地へ</a></p>
</div>
<script>
const API='https://hitokoto-relay.haqei64384.workers.dev';
const token=localStorage.getItem('hitokoto_token');
if(!token) location.href='index.html';
const ICONS={'性格的特徴':'🌗','資質・強み':'💎','能力・スキル':'🛠','価値観・大切にしているもの':'🧭','行動パターン(癖)':'🔁','変化してきていること':'🌱'};
const CFL={strong:'定着',medium:'見えてきた',new:'新発見'};
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
async function sendAnswer(qid){
  const ta=document.getElementById('ta-'+qid);
  const a=ta.value.trim();
  if(!a)return;
  const q=(window._profile.gapQuestions||[]).find(x=>x.id===qid);
  await fetch(API+'/answers',{method:'POST',headers:{'x-token':token,'Content-Type':'application/json'},body:JSON.stringify({qid,q:q?.q||'',a})});
  const el=document.getElementById('gap-'+qid);
  el.innerHTML='<div style="color:var(--ac);font-size:13.5px;padding:6px 0">✅ 受け取りました。次の洗練で反映されます</div>';
}
(async()=>{
  try{
    const p=await (await fetch(API+'/profile',{headers:{'x-token':token}})).json();
    window._profile=p;
    window._answers=await (await fetch(API+'/answers',{headers:{'x-token':token}})).json();
    if(!p.sections){document.getElementById('body').innerHTML='<div class="empty">まだ生成されていません。まどかと話すと、日曜の朝にここができあがります。</div>';return}
    const fw=p.frameworks;
    const answered=new Set((window._answers||[]).map(a=>a.qid));
    const gaps=(p.gapQuestions||[]).filter(q=>!answered.has(q.id));
    const dg=p.digest;
    document.getElementById('body').innerHTML=
      (dg?`<div class="summary" style="background:#37423a">
        <div style="font-size:12px;letter-spacing:.12em;color:#a8c3ab;font-weight:700;margin-bottom:6px">総合まとめ — 一言でいうと</div>${esc(dg.oneliner)}</div>
      <div class="sec" style="border-color:#c9d8ca">
        <h2><span>💪</span>強みと、その使い方</h2>${
        (dg.strengths||[]).map(s=>`<div class="item"><div style="font-size:14.5px;font-weight:700">${esc(s.what)}</div><div style="font-size:13px;margin-top:3px;background:#f2f7f2;border-radius:9px;padding:7px 11px">▶ ${esc(s.use)}</div></div>`).join('')}</div>
      <div class="sec" style="border-color:#e3cdd1">
        <h2><span>🕳</span>苦手なこと（隠さず明確に）と、仕組みでの設計</h2>${
        (dg.weaknesses||[]).map(w=>`<div class="item"><div style="font-size:14.5px;font-weight:700;color:#a05a68">${esc(w.what)}</div><div style="font-size:12px;color:var(--ink2);margin-top:2px">⚠ 出やすい場面: ${esc(w.trigger)}</div><div style="font-size:13px;margin-top:4px;background:#faf2f3;border-radius:9px;padding:7px 11px">🔧 ${esc(w.design)}</div></div>`).join('')}</div>
      <div class="sec" style="border-color:#e0d6c2">
        <h2><span>🪤</span>認知の罠 — 「またやってるな」に気づく合言葉</h2>${
        (dg.traps||[]).map(t=>`<div class="item" style="font-size:14px">・${esc(t)}</div>`).join('')}</div>
      <div class="sec">
        <h2><span>🎯</span>力が出る条件 / 死ぬ条件</h2>
        <div class="item"><b style="color:var(--ac);font-size:13px">✓ 力が出る</b><div style="font-size:13.5px">${esc(dg.fit?.works||'')}</div></div>
        <div class="item"><b style="color:#a05a68;font-size:13px">✗ 避ける</b><div style="font-size:13.5px">${esc(dg.fit?.avoid||'')}</div></div>
      </div>`:'')+
      `<div class="summary">${esc(p.summary)}</div>
       <div class="meta">${p.updated} 更新 ・ これまで${(p.history||[]).length}回の洗練</div>`+
      p.sections.map(s=>`<div class="sec"><h2><span>${ICONS[s.title]??'📄'}</span>${esc(s.title)}</h2>${
        s.items.map(it=>`<div class="item"><div class="pt"><span class="cf ${it.confidence}">${CFL[it.confidence]??''}</span><span>${esc(it.point)}</span></div><div class="evd">${esc(it.evidence)}</div></div>`).join('')
      }</div>`).join('')+
      (fw?`<div class="sec" style="border-color:#d8cbb8;background:#fdfaf4"><h2><span>🗺</span>世の中の分類でいうと</h2>
        <p style="font-size:12px;color:var(--ink2);margin-bottom:6px">${esc(fw.note||'会話からの推定であり、検査結果ではありません')}</p>${
        (fw.items||[]).map(it=>`<div class="item">
          <div class="pt"><span class="cf ${it.confidence==='high'?'strong':it.confidence==='low'?'new':'medium'}">${it.confidence==='high'?'確度高':it.confidence==='low'?'参考':'中'}</span><span><b>${esc(it.name)}</b> — ${esc(it.estimate)}</span></div>
          <div class="evd">${esc(it.detail)}</div>
          ${it.missing?`<div class="evd" style="border-left-color:#e4d3bd">🔍 確かめるのに足りない材料: ${esc(it.missing)}</div>`:''}
        </div>`).join('')}</div>`:'')+
      (gaps.length?`<div class="sec" style="border-color:#c9d8ca;background:#f6faf6"><h2><span>✍️</span>足りない材料を埋める（${gaps.length}問・答えた分だけ精度が上がる）</h2>
        <p style="font-size:12px;color:var(--ink2);margin-bottom:6px">全部でなくてOK。気が向いた質問だけ。回答は次の洗練(日曜朝)で反映されます。</p>${
        gaps.map(q=>`<div class="item" id="gap-${q.id}">
          <div style="font-size:11px;color:var(--ac);font-weight:700">${esc(q.area)}</div>
          <div style="font-size:14.5px;margin:2px 0 6px">${esc(q.q)}</div>
          ${q.hint?`<div style="font-size:11.5px;color:var(--ink2);margin-bottom:6px">💡${esc(q.hint)}</div>`:''}
          <textarea id="ta-${q.id}" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px;font-size:14px;font-family:inherit;min-height:52px" placeholder="思ったままでOK"></textarea>
          <button onclick="sendAnswer('${q.id}')" style="margin-top:5px;background:var(--ac);color:#fff;border:none;border-radius:9px;padding:7px 18px;font-size:13px;font-weight:700">答える</button>
        </div>`).join('')}</div>`:
        (p.gapQuestions&&p.gapQuestions.length?`<div class="sec" style="text-align:center;color:var(--ink2);font-size:13.5px">✅ 用意した質問には全部答えてもらいました。次の洗練で新しい質問が出ることがあります</div>`:''));
  }catch(e){document.getElementById('body').innerHTML='<div class="empty">読み込みに失敗しました</div>'}
})();
</script>
</body>
</html>
