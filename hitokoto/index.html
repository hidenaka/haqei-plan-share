<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f2ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="portraits/cand-C-01.png">
<title>日記</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f4f2ed;
    --panel: #fff;
    --ink: #262522;
    --muted: #85817a;
    --line: #dedbd4;
    --accent: #4f7758;
    --heart: #c4838f;
    --shadow: 0 1px 1px rgba(30, 27, 22, .08), 0 2px 8px rgba(30, 27, 22, .04);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); }
  body {
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 16px;
    line-height: 1.75;
  }
  button, textarea, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: rgba(244, 242, 237, .92);
    backdrop-filter: saturate(140%) blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .bar .ttl { font-size: 17px; font-weight: 800; letter-spacing: .04em; }
  .bar nav { margin-left: auto; display: flex; gap: 6px; }
  .bar nav a {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; text-decoration: none; background: var(--panel);
    border: 1px solid var(--line);
  }

  .feed { max-width: 620px; margin: 0 auto; padding: 12px 12px calc(28px + env(safe-area-inset-bottom)); }

  .composer {
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 14px;
  }
  .composer textarea {
    width: 100%; border: 0; outline: 0; resize: none; background: transparent;
    font-size: 17px; line-height: 1.75; max-height: 45vh; overflow-y: auto;
  }
  .composer textarea::placeholder { color: #b3aca1; }
  .crow { display: flex; align-items: center; margin-top: 8px; }
  .crow .hint { font-size: 12.5px; color: var(--muted); }
  .put {
    margin-left: auto; border: 0; border-radius: 999px; padding: 7px 22px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 700;
  }
  .put:disabled { background: #cfd6cf; color: #f4f2ed; }

  .sep { text-align: center; font-size: 12px; color: var(--muted); margin: 18px 0 8px; }
  .post {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow);
    white-space: pre-wrap; word-break: break-word;
    -webkit-user-select: none; user-select: none;
  }
  .post.pressing { background: #efece5; }
  .post .body { font-size: 16.5px; }
  .post .meta { margin-top: 6px; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .post .heart { color: var(--heart); font-size: 13.5px; }
  .post.unsent { border-style: dashed; opacity: .78; }

  .empty { text-align: center; color: var(--muted); font-size: 14.5px; padding: 40px 20px 20px; white-space: pre-line; }

  .gate, .sheet {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: rgba(38, 37, 34, .5);
  }
  .sheet { align-items: flex-end; }
  .gate-card, .sheet-card {
    width: 100%; max-width: 360px; background: var(--panel);
    border-radius: 20px; padding: 22px; text-align: center; box-shadow: var(--shadow);
  }
  .sheet-card { max-width: 420px; margin-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .gate-photo { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; object-position: 50% 18%; }
  .gate-title { font-size: 19px; margin: 12px 0 6px; }
  .gate-copy, .sheet-copy { font-size: 14px; color: var(--muted); margin: 0 0 14px; }
  .token-input {
    width: 100%; border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 14px; margin-bottom: 8px; background: var(--paper);
  }
  .gate-error { font-size: 13px; color: #b4675f; min-height: 20px; margin: 0 0 6px; }
  .primary-button, .sheet-btn {
    width: 100%; border: 0; border-radius: 999px; padding: 12px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 700;
  }
  .sheet-btn.danger { background: #b4675f; margin-bottom: 8px; }
  .sheet-btn.quiet { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 12px); z-index: 30;
    background: rgba(38, 37, 34, .92); color: #fff; font-size: 14px;
    padding: 9px 18px; border-radius: 999px; opacity: 0;
    transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<header class="bar">
  <b class="ttl">日記</b>
  <nav>
    <a href="talk.html" aria-label="まどかとのトーク" title="まどかとのトーク">💬</a>
    <a href="growth.html" aria-label="成長の現在地" title="成長の現在地">📍</a>
    <a href="profile.html" aria-label="わたしの取扱説明書" title="わたしの取扱説明書">👤</a>
  </nav>
</header>

<main class="feed">
  <form class="composer" id="composer">
    <textarea id="box" rows="1" placeholder="いま、なに考えてる？" aria-label="日記を書く"></textarea>
    <div class="crow">
      <span class="hint" id="hint"></span>
      <button class="put" id="putBtn" type="submit" disabled>置く</button>
    </div>
  </form>
  <div id="list"></div>
</main>

<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gateForm">
    <img class="gate-photo" src="portraits/cand-C-01.png" alt="">
    <h1 class="gate-title">日記</h1>
    <p class="gate-copy">最初の一度だけ、あいことばを入れてください。</p>
    <input class="token-input" id="tokenIn" type="password" autocomplete="current-password" aria-label="あいことば">
    <p class="gate-error" id="gateError" aria-live="polite"></p>
    <button class="primary-button" type="submit">入る</button>
  </form>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-label="投稿を消す">
    <p class="sheet-copy" id="sheetCopy">この投稿を消しますか。</p>
    <button class="sheet-btn danger" id="delBtn" type="button">消す</button>
    <button class="sheet-btn quiet" id="cancelBtn" type="button">やめる</button>
  </div>
</div>

<div class="toast" id="toast" aria-live="polite"></div>

<script>
const RELAY = 'https://hitokoto-relay.haqei64384.workers.dev';
const DRAFT_KEY = 'diary_draft';
const QUEUE_KEY = 'diary_queue';
const CACHE_KEY = 'diary_cache';

let token = localStorage.getItem('hitokoto_token');
let posts = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]');
let queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
let pendingDelete = null;
let toastTimer = null;
let pressTimer = null;
let flushing = false;

const $ = id => document.getElementById(id);
const box = $('box');
const listEl = $('list');

function make(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}

function showGate(message = '') {
  $('gate').hidden = false;
  $('gateError').textContent = message;
  requestAnimationFrame(() => $('tokenIn').focus());
}
function hideGate() {
  $('gate').hidden = true;
  $('gateError').textContent = '';
}
function showToast(message) {
  const el = $('toast');
  el.textContent = message;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2300);
}

async function api(method, path, body) {
  const response = await fetch(RELAY + path, {
    method,
    headers: { 'x-token': token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if (response.status === 401) {
    localStorage.removeItem('hitokoto_token');
    token = null;
    showGate('あいことばが違うようです');
    throw new Error('unauthorized');
  }
  if (!response.ok) throw new Error(path + ': ' + response.status);
  return response.json();
}

const saveQueue = () => localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));

// ---- 時刻の見せ方 ----
function jstParts(ts) {
  const d = new Date(new Date(ts).getTime() + 9 * 3600000);
  const iso = d.toISOString();
  return { key: iso.slice(0, 10), hm: iso.slice(11, 16), md: Number(iso.slice(5, 7)) + '月' + Number(iso.slice(8, 10)) + '日' };
}
function relText(ts) {
  const diffMin = (Date.now() - new Date(ts).getTime()) / 60000;
  if (diffMin < 1) return 'いま';
  if (diffMin < 60) return Math.floor(diffMin) + '分前';
  const now = jstParts(new Date().toISOString());
  const at = jstParts(ts);
  if (at.key === now.key) return at.hm;
  const yesterday = jstParts(new Date(Date.now() - 86400000).toISOString());
  if (at.key === yesterday.key) return '昨日 ' + at.hm;
  return at.md + ' ' + at.hm;
}

// ---- 描画（新しいものが上・日付で区切る） ----
function render() {
  const fragment = document.createDocumentFragment();
  for (const item of queue) {
    const el = make('div', 'post unsent');
    el.appendChild(make('div', 'body', item.text));
    const meta = make('div', 'meta');
    meta.appendChild(make('span', null, '未送信'));
    el.appendChild(meta);
    fragment.appendChild(el);
  }
  const sorted = [...posts].sort((a, b) => new Date(b.ts) - new Date(a.ts));
  const today = jstParts(new Date().toISOString()).key;
  let lastKey = queue.length ? today : null;
  for (const post of sorted) {
    const at = jstParts(post.ts);
    if (at.key !== lastKey) {
      fragment.appendChild(make('div', 'sep', at.key === today ? '今日' : at.md));
      lastKey = at.key;
    }
    const el = make('div', 'post');
    el.dataset.id = post.id;
    el.appendChild(make('div', 'body', post.text));
    const meta = make('div', 'meta');
    meta.appendChild(make('span', null, relText(post.ts)));
    if (post.read) meta.appendChild(make('span', 'heart', '♡'));
    el.appendChild(meta);
    fragment.appendChild(el);
  }
  if (!sorted.length && !queue.length) {
    fragment.appendChild(make('div', 'empty', 'ここは、返事の来ない場所です。\n書いたものが下に積もります。'));
  }
  listEl.replaceChildren(fragment);
  updateHint();
}

// ---- 読み込み ----
async function load() {
  if (!token) return;
  try {
    const data = await api('GET', '/diary');
    posts = data.posts ?? [];
    localStorage.setItem(CACHE_KEY, JSON.stringify(posts));
    render();
  } catch (error) {
    if (error.message !== 'unauthorized') console.warn(error);
  }
}

// ---- 送信（失敗したら未送信として端末に残す） ----
async function flush() {
  if (!token || !queue.length || flushing) return;
  flushing = true;
  try {
    const rest = [];
    let sent = 0;
    for (const item of queue) {
      try {
        await api('POST', '/diary', { text: item.text, ts: item.ts });
        sent++;
      } catch (error) {
        rest.push(item);
        if (error.message === 'unauthorized') break;
      }
    }
    queue = rest;
    saveQueue();
    if (sent) await load(); else render();
  } finally {
    flushing = false;
  }
}

// 書く欄のお知らせ。navigator.onLine はキャッシュ起動直後に当てにならないので、
// 「送れていないものが実際にあるか」で出す
function updateHint() {
  $('hint').textContent = queue.length ? '電波が戻ったら送ります' : '';
}

function resizeBox() {
  box.style.height = 'auto';
  box.style.height = Math.min(box.scrollHeight, window.innerHeight * 0.45) + 'px';
  $('putBtn').disabled = !box.value.trim();
}

$('composer').addEventListener('submit', async event => {
  event.preventDefault();
  const text = box.value.trim();
  if (!text) return;
  queue.push({ cid: Date.now().toString(36), text, ts: new Date().toISOString() });
  saveQueue();
  box.value = '';
  localStorage.removeItem(DRAFT_KEY);
  resizeBox();
  render();
  await flush();
  if (queue.length) showToast('いまは送れないので、端末に置いておきます');
});

box.addEventListener('input', () => {
  localStorage.setItem(DRAFT_KEY, box.value);
  resizeBox();
});

// ---- 長押しで消す ----
function openSheet(id) {
  pendingDelete = id;
  $('sheet').hidden = false;
}
listEl.addEventListener('pointerdown', event => {
  const el = event.target.closest('.post');
  if (!el || !el.dataset.id) return;
  el.classList.add('pressing');
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => { el.classList.remove('pressing'); openSheet(el.dataset.id); }, 600);
});
['pointerup', 'pointercancel', 'pointerleave', 'scroll'].forEach(type => {
  listEl.addEventListener(type, () => {
    clearTimeout(pressTimer);
    listEl.querySelectorAll('.post.pressing').forEach(el => el.classList.remove('pressing'));
  }, true);
});
$('cancelBtn').addEventListener('click', () => { pendingDelete = null; $('sheet').hidden = true; });
$('delBtn').addEventListener('click', async () => {
  const id = pendingDelete;
  pendingDelete = null;
  $('sheet').hidden = true;
  if (!id) return;
  try {
    await api('POST', '/diary/delete', { id });
    posts = posts.filter(p => p.id !== id);
    localStorage.setItem(CACHE_KEY, JSON.stringify(posts));
    render();
  } catch (error) {
    if (error.message !== 'unauthorized') showToast('消せませんでした');
  }
});

// ---- ゲート ----
$('gateForm').addEventListener('submit', async event => {
  event.preventDefault();
  const value = $('tokenIn').value.trim();
  if (!value) return;
  token = value;
  localStorage.setItem('hitokoto_token', token);
  hideGate();
  await load();
  await flush();
});

// ---- 起動 ----
const draft = localStorage.getItem(DRAFT_KEY);
if (draft) box.value = draft;
resizeBox();
updateHint();
render();
if (token) { load(); flush(); } else showGate();
setInterval(() => { load(); flush(); }, 60000);
window.addEventListener('online', () => { flush(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); flush(); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
