<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>開発コックピット</title>
<style>
:root{--ink:#e8e6e3;--ink2:#8d8a85;--bg:#16181c;--card:#1e2126;--line:#2c3037;--ac:#6aa9e0;--ok:#6cc48f;--warn:#e0b25a;--bad:#e08585;--run:#6aa9e0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 8px;position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px}
header b{font-size:15px;flex:1}
header .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
header a{color:var(--ac);text-decoration:none;font-size:13px}
.wrap{max-width:680px;margin:0 auto;padding:12px}
/* セッションタブ(野田式) */
.tabs{display:flex;gap:7px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px 12px;font-size:12.5px;white-space:nowrap}
.tab.sel{border-color:var(--ac);background:#22303c}
.tab .n{font-weight:800;margin-right:5px}
.tab .st{font-size:11px}
.st-running{color:var(--run)}.st-blocked{color:var(--warn)}.st-done{color:var(--ok)}.st-failed{color:var(--bad)}.st-queued{color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px}
.card h2{font-size:12px;color:var(--ink2);font-weight:700;letter-spacing:.05em;margin-bottom:8px}
.jt{font-size:15.5px;font-weight:700;margin-bottom:2px}
.meta{font-size:11.5px;color:var(--ink2)}
.sum{font-size:13.5px;background:#171a1e;border-radius:9px;padding:9px 11px;margin-top:8px;border-left:3px solid var(--ac)}
.instr{font-size:13px;color:var(--warn);background:#241f16;border-radius:9px;padding:8px 11px;margin-top:8px}
pre{background:#101215;border-radius:9px;padding:10px;font-size:11px;line-height:1.5;overflow-x:auto;white-space:pre-wrap;word-break:break-all;max-height:320px;overflow-y:auto;color:#b8c4cf;margin-top:8px}
.row{display:flex;gap:7px;margin-top:9px}
button{font-family:inherit;border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;color:#fff;background:var(--ac)}
button.sub{background:#2c3037;color:var(--ink)}
button.dgr{background:#5a3236;color:#ffd9d9}
textarea,select,input{width:100%;background:#101215;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;font-family:inherit;margin-bottom:8px}
textarea{min-height:74px;resize:vertical}
.empty{color:var(--ink2);text-align:center;padding:28px 0;font-size:13.5px}
/* 新規指示バー(常時下部) */
.compose{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:9}
.compose .r{display:flex;gap:7px;align-items:flex-end}
.compose textarea{margin:0;min-height:42px;max-height:120px}
.compose select{width:auto;margin:0;padding:9px;font-size:12px}
.fab{position:fixed;right:14px;bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ac);width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:8}
.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#0d0f12;border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:8px 18px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><b>開発コックピット</b><span class="meta" id="hdr"></span><a href="index.html">まどか →</a></header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="detail"></div>
</div>

<div class="compose">
  <div class="r">
    <textarea id="np" placeholder="新しい指示（例: ○○を直して。テストも通して）"></textarea>
    <div style="display:flex;flex-direction:column;gap:6px">
      <select id="agent"><option value="codex">Codex</option><option value="claude">Claude</option><option value="both">両方</option></select>
      <button onclick="submitJob()">投げる</button>
    </div>
  </div>
  <select id="cwd" style="margin-top:7px;font-size:12px;width:100%">
    <option value="/Users/hideakimacbookair/homare">homare（まどかアプリ）</option>
    <option value="/Users/hideakimacbookair/易経ロジックチェーン">易経ロジックチェーン</option>
    <option value="">その他（既定）</option>
  </select>
</div>
<div class="toast" id="toast"></div>
<script>
const API='https://hitokoto-relay.haqei64384.workers.dev';
const token=localStorage.getItem('hitokoto_token');
if(!token) location.href='index.html';
const H={'x-token':token,'Content-Type':'application/json'};
const LBL={running:'作業中',blocked:'返答待ち',queued:'待機中',done:'完了',failed:'停止',canceled:'中止'};
let jobs=[],sel=null,timer=null;
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
function ago(iso){if(!iso)return'';const s=Math.floor((Date.now()-new Date(iso))/1000);if(s<60)return s+'秒';if(s<3600)return Math.floor(s/60)+'分';return Math.floor(s/3600)+'時間'}
// 並び順: 返答待ち→作業中→待機中→完了/停止（調査の設計原則: 私が答えないと止まるものを最上位に）
const ORD={blocked:0,running:1,queued:2,done:3,failed:4,canceled:5};
async function load(){
  try{
    jobs=await (await fetch(API+'/dev/jobs',{headers:H})).json();
    jobs.sort((a,b)=>(ORD[a.status]??9)-(ORD[b.status]??9)||new Date(b.createdAt)-new Date(a.createdAt));
    if(!sel||!jobs.find(j=>j.id===sel))sel=jobs[0]?.id;
    render();
  }catch(e){document.getElementById('dot').style.background='#e08585'}
}
function render(){
  const act=jobs.filter(j=>j.status==='running'||j.status==='blocked').length;
  document.getElementById('hdr').textContent=act?`${act}件 稼働中`:'待機';
  document.getElementById('dot').style.background=act?'var(--run)':'var(--ok)';
  document.getElementById('tabs').innerHTML=jobs.length?jobs.map((j,i)=>
    `<div class="tab ${j.id===sel?'sel':''}" onclick="pick('${j.id}')"><span class="n">${i+1}</span><span class="st st-${j.status}">${LBL[j.status]||j.status}</span></div>`
  ).join(''):'<div class="meta">まだ指示はありません</div>';
  const j=jobs.find(x=>x.id===sel);
  document.getElementById('detail').innerHTML=j?`
    <div class="card">
      <div class="jt">${esc(j.title)}</div>
      <div class="meta">${j.agent} ・ ${esc((j.cwd||'既定').split('/').pop())} ・ ${j.startedAt?ago(j.startedAt)+'経過':ago(j.createdAt)+'前に受付'} ${j.status==='running'?'・実行中':''}</div>
      ${j.progress?`<div class="sum">📍 ${esc(j.progress)}</div>`:''}
      <div class="instr">🗣 指示: ${esc(j.prompt).slice(0,300)}</div>
      ${j.result?`<div class="sum" style="border-left-color:var(--ok)">✅ ${esc(j.result).slice(0,700)}</div>`:''}
      <div class="row">
        ${j.status==='running'||j.status==='queued'?`<button class="dgr" onclick="cancelJob('${j.id}')">中止</button>`:''}
        <button class="sub" onclick="showLog('${j.id}')">ログを見る</button>
        <button class="sub" onclick="again('${j.id}')">同じ指示で再実行</button>
      </div>
      <div id="logbox"></div>
      <div style="margin-top:10px">
        <textarea id="fu" placeholder="このセッションへ追加指示（次の実行時に反映）"></textarea>
        <button onclick="sendFollowup('${j.id}')">追加指示を送る</button>
      </div>
    </div>`:'<div class="empty">下の入力欄から、Mac上のAIへ指示を出せます</div>';
}
function pick(id){sel=id;render()}
async function showLog(id){
  const j=await (await fetch(API+'/dev/jobs?id='+id,{headers:H})).json();
  document.getElementById('logbox').innerHTML=`<pre>${esc(j.log||'(ログなし)')}</pre>`;
  const p=document.querySelector('pre'); if(p)p.scrollTop=p.scrollHeight;
}
async function submitJob(){
  const prompt=document.getElementById('np').value.trim();
  if(!prompt)return toast('指示を書いてね');
  await fetch(API+'/dev/jobs',{method:'POST',headers:H,body:JSON.stringify({prompt,agent:document.getElementById('agent').value,cwd:document.getElementById('cwd').value})});
  document.getElementById('np').value='';toast('Macへ送りました');load();
}
async function again(id){
  const j=jobs.find(x=>x.id===id);
  await fetch(API+'/dev/jobs',{method:'POST',headers:H,body:JSON.stringify({prompt:j.prompt,agent:j.agent,cwd:j.cwd,title:j.title})});
  toast('再実行を投げました');load();
}
async function cancelJob(id){await fetch(API+'/dev/cancel',{method:'POST',headers:H,body:JSON.stringify({id})});toast('中止を要求');load()}
async function sendFollowup(id){
  const t=document.getElementById('fu').value.trim();if(!t)return;
  await fetch(API+'/dev/followup',{method:'POST',headers:H,body:JSON.stringify({id,text:t})});
  document.getElementById('fu').value='';toast('追加指示を送りました');
}
load();timer=setInterval(load,10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script>
</body>
</html>
