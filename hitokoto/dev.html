<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>開発コックピット</title>
<style>
:root{
  --bg:#0f1115;--panel:#171a20;--panel2:#1d2129;--line:#272c35;--ink:#e9e7e3;--ink2:#8b8f98;
  --run:#5aa9f0;--wait:#f0b95a;--ok:#5ecb95;--bad:#f07d7d;--idle:#5b6270;--acc:#7c6ce0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain}
body{font-family:-apple-system,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(9px + env(safe-area-inset-top)) 14px 9px}
.hrow{display:flex;align-items:center;gap:9px}
.hrow b{font-size:15px}
.hrow .sp{flex:1}
.hrow a{color:var(--ink2);text-decoration:none;font-size:20px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--idle);flex-shrink:0}
.pulse.live{background:var(--run);box-shadow:0 0 0 0 rgba(90,169,240,.6);animation:pl 1.8s infinite}
@keyframes pl{70%{box-shadow:0 0 0 9px rgba(90,169,240,0)}100%{box-shadow:0 0 0 0 rgba(90,169,240,0)}}
.stats{display:flex;gap:13px;margin-top:7px;font-size:11.5px;color:var(--ink2);overflow-x:auto}
.stats i{font-style:normal;font-weight:800;font-size:14px;margin-right:3px}
.s-run i{color:var(--run)}.s-wait i{color:var(--wait)}.s-ok i{color:var(--ok)}.s-bad i{color:var(--bad)}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 0}
.grp{font-size:11px;color:var(--ink2);letter-spacing:.12em;font-weight:800;margin:15px 2px 7px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:9px;position:relative;overflow:hidden}
.card.sel{border-color:#3c4a5c;background:var(--panel2)}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--idle)}
.card.st-running:before{background:var(--run)}.card.st-blocked:before{background:var(--wait)}
.card.st-done:before{background:var(--ok)}.card.st-failed:before{background:var(--bad)}
.top{display:flex;align-items:baseline;gap:8px}
.idx{font-size:11px;font-weight:800;color:var(--ink2);background:#0c0e12;border-radius:6px;padding:1px 7px;flex-shrink:0}
.ttl{font-size:14.5px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{font-size:11px;color:var(--ink2);flex-shrink:0;font-variant-numeric:tabular-nums}
.doing{display:flex;gap:7px;align-items:flex-start;margin-top:9px;font-size:13.5px;line-height:1.5}
.doing .ic{flex-shrink:0;font-size:13px}
.doing.run{color:#cfe3f6}.doing.wait{color:#f3dcae}.doing.ok{color:#c3e8d4}.doing.bad{color:#f2c4c4}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.chip{font-size:10.5px;color:var(--ink2);background:#0f1217;border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.chip.sk{color:#c9b6ea;border-color:#3a3350}
.chip.df{color:#8fd0a8;border-color:#2c4436}
.bar{height:3px;background:#0c0e12;border-radius:2px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:36%;background:linear-gradient(90deg,transparent,var(--run),transparent);animation:sl 1.6s linear infinite}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
.det{margin-top:11px;border-top:1px solid var(--line);padding-top:11px}
.lbl{font-size:10.5px;color:var(--ink2);letter-spacing:.08em;font-weight:800;margin-bottom:4px}
.box{background:#0c0e12;border-radius:10px;padding:9px 11px;font-size:12.5px;color:#c3c8d0;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow-y:auto}
pre{background:#0a0c0f;border-radius:10px;padding:10px;font-size:10.5px;line-height:1.5;overflow:auto;white-space:pre-wrap;word-break:break-all;max-height:300px;color:#9aa6b3;margin-top:6px}
.row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
button{font-family:inherit;border:none;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;color:#0f1115;background:var(--run);min-height:40px}
button.g{background:#252a33;color:var(--ink)}
button.r{background:#4a2b30;color:#f5c9c9}
textarea,select,input{width:100%;background:#0c0e12;color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:11px;font-size:16px;font-family:inherit}
textarea{min-height:60px;resize:vertical}
.empty{color:var(--ink2);text-align:center;padding:34px 12px;font-size:13.5px;line-height:1.9}
/* ===== 指示バー(スマホ最適化) ===== */
.cmp{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(23,26,32,.98);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:9px 11px calc(9px + env(safe-area-inset-bottom));transition:transform .2s}
.cmp .r2{display:flex;gap:8px;align-items:flex-end}
.cmp textarea{min-height:46px;max-height:130px}
.cmp .send{padding:0;width:48px;height:46px;font-size:19px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
/* 選択トグル: 折りたたみ式 */
.opt{display:flex;gap:6px;align-items:center;margin-bottom:8px;overflow-x:auto;padding-bottom:2px}
.pill{flex:0 0 auto;background:#0f1217;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--ink2);white-space:nowrap;display:flex;gap:5px;align-items:center}
.pill b{color:var(--ink);font-weight:700}
.pill.on{border-color:var(--acc);color:#cbbdf5}
.sheet{position:fixed;inset:0;background:rgba(6,7,10,.72);z-index:40;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheetin{background:var(--panel);border-radius:18px 18px 0 0;width:100%;max-height:76vh;display:flex;flex-direction:column;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sheetin h3{font-size:14px;margin-bottom:10px}
.sheetin .search{margin-bottom:9px}
.list{overflow-y:auto;-webkit-overflow-scrolling:touch}
.item{padding:11px 12px;border-radius:11px;background:#0f1217;border:1px solid transparent;margin-bottom:6px}
.item.on{border-color:var(--acc);background:#191630}
.item .n{font-size:14px;font-weight:700}
.item .d{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.4}
.sc{font-size:10px;color:var(--acc);margin-left:6px}
.rep{margin-top:10px}
.rep .hl{font-size:14.5px;font-weight:700;line-height:1.5;margin-bottom:8px}
.rep ul{list-style:none;margin:0}
.rep li{font-size:13.5px;line-height:1.6;padding-left:18px;position:relative;margin-bottom:3px;color:#cdd3da}
.rep li:before{content:"✓";position:absolute;left:0;color:var(--ok);font-size:12px}
.ask{background:#241f16;border:1px solid #4a3d22;border-radius:11px;padding:11px 12px;margin-top:10px}
.ask .t{font-size:11px;color:var(--wait);font-weight:800;letter-spacing:.06em;margin-bottom:4px}
.ask .b{font-size:14px;line-height:1.6;color:#f6e6c6}
.stuck{background:#2a1c1e;border:1px solid #4d2f33;border-radius:11px;padding:10px 12px;margin-top:8px;font-size:13px;color:#f0c8c8}
.nextb{font-size:12.5px;color:var(--ink2);margin-top:8px;padding-left:16px;position:relative}
.nextb:before{content:"→";position:absolute;left:0;color:var(--run)}
.stbar{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.stbtn{flex:1;min-width:78px;background:#0f1217;border:1px solid var(--line);border-radius:10px;padding:9px 4px;font-size:11.5px;font-weight:700;color:var(--ink2);text-align:center;min-height:38px;display:flex;align-items:center;justify-content:center;gap:4px}
.stbtn.cur{border-color:currentColor}
.stbtn.b-done{color:var(--ok)}.stbtn.b-blocked{color:var(--wait)}.stbtn.b-queued{color:var(--run)}
.stbtn.b-canceled{color:var(--idle)}.stbtn.b-archived{color:var(--idle)}
.pin{position:absolute;right:10px;top:10px;font-size:15px;opacity:.35;padding:3px 6px}
.pin.on{opacity:1}
.mflag{font-size:10px;color:var(--acc);margin-left:6px}
.showarc{text-align:center;color:var(--ink2);font-size:12px;padding:12px;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#0a0c0f;border:1px solid var(--line);border-radius:20px;padding:9px 18px;font-size:12.5px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="hrow"><span class="pulse" id="pulse"></span><b>開発コックピット</b><span class="sp"></span><a href="index.html">💬</a></div>
  <div class="stats" id="stats"></div>
</header>
<div class="wrap" id="board"><div class="empty">読み込み中…</div></div>

<div class="cmp" id="cmp">
  <div class="opt">
    <div class="pill" id="pProj" onclick="openSheet('proj')">📁 <b id="lProj">…</b></div>
    <div class="pill" id="pSkill" onclick="openSheet('skill')">🧩 <b id="lSkill">スキルなし</b></div>
    <div class="pill" id="pAgent" onclick="cycleAgent()">🤖 <b id="lAgent">Codex</b></div>
  </div>
  <div class="r2">
    <textarea id="np" placeholder="指示を書く（例: 字幕のズレを直してテストも通して）" oninput="grow(this);saveDraft('np',this.value)"></textarea>
    <button class="send" onclick="submitJob()">↑</button>
  </div>
</div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="sheetin">
    <h3 id="sheetTitle"></h3>
    <input class="search" id="sq" placeholder="絞り込む" oninput="renderSheet()">
    <div class="list" id="sheetList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const API='https://hitokoto-relay.haqei64384.workers.dev';
const token=localStorage.getItem('hitokoto_token');
if(!token) location.href='index.html';
const H={'x-token':token,'Content-Type':'application/json'};
const LBL={running:'作業中',blocked:'返答待ち',queued:'待機中',done:'完了',failed:'停止',canceled:'中止'};
const ICO={running:'⚙️',blocked:'🙋',queued:'⏳',done:'✅',failed:'⛔',canceled:'⏹'};
const TONE={running:'run',blocked:'wait',done:'ok',failed:'bad',queued:'',canceled:''};
const AGENTS=[['codex','Codex'],['claude','Claude'],['both','両方']];
let jobs=[],open=new Set(),meta={skills:[],projects:[]},sheetMode='',
    sel={cwd:localStorage.getItem('dev_cwd')||'',skill:localStorage.getItem('dev_skill')||'',agent:localStorage.getItem('dev_agent')||'codex'};
// 入力中の文字を絶対に消さないための仕組み(2026-08-13 実害)
const drafts=JSON.parse(localStorage.getItem('dev_drafts')||'{}');
function saveDraft(id,v){if(v)drafts[id]=v;else delete drafts[id];localStorage.setItem('dev_drafts',JSON.stringify(drafts))}
function isTyping(){const a=document.activeElement;return a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')}
function restoreDrafts(){
  document.querySelectorAll('textarea[id]').forEach(t=>{if(drafts[t.id]&&!t.value)t.value=drafts[t.id]});
}
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1700)}
function dur(ms){if(!ms||ms<0)return'';const s=Math.floor(ms/1000);if(s<60)return s+'秒';const m=Math.floor(s/60);if(m<60)return m+'分';return Math.floor(m/60)+'時間'+(m%60)+'分'}
function ago(iso){return iso?dur(Date.now()-new Date(iso)):''}
function grow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,130)+'px'}
const GROUPS=[['blocked','あなたの返事待ち'],['running','いま動いている'],['queued','順番待ち'],['done','終わったもの'],['failed','止まったもの'],['canceled','やめたもの']];
const STATUS_BTNS=[['done','完了','✅'],['blocked','返事待ち','🙋'],['queued','もう一度実行','🔄'],['canceled','やめる','⏹'],['archived','片付ける','📦']];
let showArchived=false;

async function loadMeta(){
  try{
    meta=await (await fetch(API+'/dev/meta',{headers:H})).json();
    if(!sel.cwd&&meta.projects?.length)sel.cwd=meta.projects[0].cwd;
    paintPills();
  }catch(e){}
}
function paintPills(){
  const p=(meta.projects||[]).find(x=>x.cwd===sel.cwd);
  document.getElementById('lProj').textContent=p?p.label:'プロジェクト';
  document.getElementById('lSkill').textContent=sel.skill||'スキルなし';
  document.getElementById('pSkill').className='pill'+(sel.skill?' on':'');
  document.getElementById('lAgent').textContent=(AGENTS.find(a=>a[0]===sel.agent)||AGENTS[0])[1];
}
function cycleAgent(){
  const i=AGENTS.findIndex(a=>a[0]===sel.agent);
  sel.agent=AGENTS[(i+1)%AGENTS.length][0];localStorage.setItem('dev_agent',sel.agent);paintPills();
}
function openSheet(m){sheetMode=m;document.getElementById('sq').value='';
  document.getElementById('sheetTitle').textContent=m==='proj'?'どこで作業する？':'スキル / ハーネスを選ぶ';
  document.getElementById('sheet').classList.add('on');renderSheet()}
function closeSheet(){document.getElementById('sheet').classList.remove('on')}
function renderSheet(){
  const q=document.getElementById('sq').value.trim().toLowerCase();
  const el=document.getElementById('sheetList');
  if(sheetMode==='proj'){
    el.innerHTML=(meta.projects||[]).map(p=>
      `<div class="item ${p.cwd===sel.cwd?'on':''}" onclick="pickProj('${esc(p.cwd)}')"><div class="n">${esc(p.label)}</div><div class="d">${esc(p.cwd)}</div></div>`).join('');
  }else{
    const ls=(meta.skills||[]).filter(s=>!q||s.name.toLowerCase().includes(q)||(s.desc||'').toLowerCase().includes(q));
    el.innerHTML=`<div class="item ${!sel.skill?'on':''}" onclick="pickSkill('')"><div class="n">スキルなし</div><div class="d">ふつうに指示するだけ</div></div>`+
      ls.map(s=>`<div class="item ${s.name===sel.skill?'on':''}" onclick="pickSkill('${esc(s.name)}')"><div class="n">${esc(s.name)}<span class="sc">${esc(s.scope)}</span></div>${s.desc?`<div class="d">${esc(s.desc)}</div>`:''}</div>`).join('');
  }
}
function pickProj(c){sel.cwd=c;localStorage.setItem('dev_cwd',c);paintPills();closeSheet()}
function pickSkill(n){sel.skill=n;localStorage.setItem('dev_skill',n);paintPills();closeSheet()}

async function load(){
  try{jobs=await (await fetch(API+'/dev/jobs',{headers:H})).json();render()}
  catch(e){document.getElementById('pulse').style.background='var(--bad)'}
}
let pendingRender=false;
function render(){
  // 入力中は描き直さない(消える事故の元)。入力が終わったら描く
  if(isTyping()){pendingRender=true;return}
  const c={};jobs.forEach(j=>c[j.status]=(c[j.status]||0)+1);
  const live=(c.running||0)+(c.blocked||0);
  document.getElementById('pulse').className='pulse'+(live?' live':'');
  document.getElementById('stats').innerHTML=[
    c.running?`<span class="s-run"><i>${c.running}</i>作業中</span>`:'',
    c.blocked?`<span class="s-wait"><i>${c.blocked}</i>返事待ち</span>`:'',
    c.queued?`<span><i>${c.queued}</i>順番待ち</span>`:'',
    c.done?`<span class="s-ok"><i>${c.done}</i>完了</span>`:'',
    c.failed?`<span class="s-bad"><i>${c.failed}</i>停止</span>`:'',
  ].filter(Boolean).join('')||'<span>まだ指示はありません</span>';
  const vis=jobs.filter(j=>j.status!=='archived');
  const pinned=vis.filter(j=>j.pinned);
  const by={};vis.filter(j=>!j.pinned).forEach(j=>{(by[j.status]=by[j.status]||[]).push(j)});
  let html='',n=0;
  if(pinned.length)html+=`<div class="grp">📌 ピン留め <span style="color:#4b515c">${pinned.length}</span></div>`+pinned.map(j=>card(j,++n)).join('');
  for(const [st,label] of GROUPS){
    const ls=(by[st]||[]).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    if(!ls.length)continue;
    html+=`<div class="grp">${label} <span style="color:#4b515c">${ls.length}</span></div>`+ls.map(j=>card(j,++n)).join('');
  }
  const arc=jobs.filter(j=>j.status==='archived');
  if(arc.length){
    html+=`<div class="showarc" onclick="showArchived=!showArchived;render()">${showArchived?'片付けたものを隠す':`片付けたもの ${arc.length}件を見る`}</div>`;
    if(showArchived)html+=arc.map(j=>card(j,++n)).join('');
  }
  document.getElementById('board').innerHTML=html||`<div class="empty">下の欄に指示を書いて ↑ を押すと、Mac上のAIが動き出します。<br>🧩からスキルを選べば、いつものハーネスがそのまま走ります。</div>`;
  restoreDrafts();
}
// 入力が終わったら溜まっていた更新を反映
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingRender&&!isTyping()){pendingRender=false;render()}},300)});
function card(j,n){
  const t=TONE[j.status]||'',opened=open.has(j.id);
  const doing=j.status==='running'?(j.progress||'起動しています'):
              j.status==='blocked'?'あなたに質問して止まっています':
              j.status==='done'?(j.progress||'完了'):
              j.status==='failed'?'途中で止まりました':
              j.status==='queued'?'Macが拾うのを待っています':(j.progress||'');
  const proj=(meta.projects||[]).find(p=>p.cwd===j.cwd)?.label||(j.cwd||'').split('/').filter(Boolean).pop()||'既定';
  return `<div class="card st-${j.status} ${opened?'sel':''}" onclick="toggle(event,'${j.id}')">
    <span class="pin ${j.pinned?'on':''}" onclick="event.stopPropagation();togglePin('${j.id}',${!j.pinned})">📌</span>
    <div class="top"><span class="idx">${n}</span><span class="ttl">${esc(j.title)}${j.manualStatus?'<span class="mflag">手動</span>':''}</span>
      <span class="tm" style="margin-right:22px">${j.status==='running'?dur(j.elapsed||(Date.now()-new Date(j.startedAt)))+'経過':ago(j.endedAt||j.createdAt)+'前'}</span></div>
    <div class="doing ${t}"><span class="ic">${ICO[j.status]||''}</span><span>${esc(j.report?.headline&&j.status!=='running'?j.report.headline:doing)}</span></div>
    ${j.report?.ask?`<div class="ask"><div class="t">🙋 確認したいこと</div><div class="b">${esc(j.report.ask)}</div></div>`:''}
    <div class="chips"><span class="chip">${esc(proj)}</span><span class="chip">${esc(j.agent)}</span>
      ${j.skill?`<span class="chip sk">🧩 ${esc(j.skill)}</span>`:''}${j.diff?`<span class="chip df">📝 ${esc(j.diff)}</span>`:''}</div>
    ${j.status==='running'?'<div class="bar"><i></i></div>':''}
    ${opened?detail(j):''}</div>`;
}
function detail(j){
  return `<div class="det" onclick="event.stopPropagation()">
    <div class="lbl">出した指示</div><div class="box">${esc(j.prompt)}</div>
    ${j.report?`<div class="lbl" style="margin-top:12px">やったこと</div>
      <div class="rep">
        ${j.report.headline?`<div class="hl">${esc(j.report.headline)}</div>`:''}
        ${(j.report.did||[]).length?`<ul>${j.report.did.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:''}
        ${j.report.stuck?`<div class="stuck">⚠ ${esc(j.report.stuck)}</div>`:''}
        ${j.report.next?`<div class="nextb">${esc(j.report.next)}</div>`:''}
      </div>`:(j.result?`<div class="lbl" style="margin-top:10px">結果</div><div class="box">${esc(j.result)}</div>`:'')}
    <div class="row">
      ${(j.status==='running'||j.status==='queued')?`<button class="r" onclick="cancelJob('${j.id}')">中止</button>`:''}
      <button class="g" onclick="showLog('${j.id}')">生ログ</button>
      ${j.report&&j.result?`<button class="g" onclick="showRaw('${j.id}')">AIの原文</button>`:''}
      <button class="g" onclick="again('${j.id}')">再実行</button>
      <button class="g" onclick="reuse('${j.id}')">この続きを書く</button>
    </div>
    <div class="lbl" style="margin-top:12px">自分で状態を変える</div>
    <div class="stbar">${STATUS_BTNS.map(([st,lb,ic])=>
      `<div class="stbtn b-${st} ${j.status===st?'cur':''}" onclick="setStatus('${j.id}','${st}')">${ic}<span>${lb}</span></div>`).join('')}</div>
    <div id="lg-${j.id}"></div>
    <div style="margin-top:10px"><textarea id="fu-${j.id}" placeholder="${j.status==='blocked'?'質問への返事を書く':'追加の指示'}" oninput="saveDraft('fu-${j.id}',this.value)"></textarea>
    <button class="g" style="margin-top:6px" onclick="sendFollowup('${j.id}')">送る</button></div></div>`;
}
function toggle(e,id){if(e.target.closest('.det'))return;open.has(id)?open.delete(id):open.add(id);render()}
function showRaw(id){const j=jobs.find(x=>x.id===id);
  document.getElementById('lg-'+id).innerHTML=`<pre>${esc(j.result||'')}</pre>`}
async function showLog(id){
  const j=await (await fetch(API+'/dev/jobs?id='+id,{headers:H})).json();
  const el=document.getElementById('lg-'+id);
  el.innerHTML=`<pre>${esc((j.log||'(ログなし)').slice(-6000))}</pre>`;
  const p=el.querySelector('pre');if(p)p.scrollTop=p.scrollHeight;
}
function reuse(id){const j=jobs.find(x=>x.id===id);
  sel.cwd=j.cwd||sel.cwd;sel.skill=j.skill||'';sel.agent=j.agent;paintPills();
  const np=document.getElementById('np');np.value=j.prompt+'\n\n続き: ';np.focus();grow(np);
  window.scrollTo({top:document.body.scrollHeight});toast('この条件で書けます')}
async function submitJob(){
  const el=document.getElementById('np'),prompt=el.value.trim();
  if(!prompt)return toast('指示を書いてね');
  await fetch(API+'/dev/jobs',{method:'POST',headers:H,body:JSON.stringify({prompt,agent:sel.agent,cwd:sel.cwd,skill:sel.skill})});
  el.value='';saveDraft('np','');grow(el);el.blur();toast('Macへ送りました');load();
}
async function again(id){const j=jobs.find(x=>x.id===id);
  await fetch(API+'/dev/jobs',{method:'POST',headers:H,body:JSON.stringify({prompt:j.prompt,agent:j.agent,cwd:j.cwd,skill:j.skill,title:j.title})});
  toast('再実行');load()}
async function setStatus(id,status){
  await fetch(API+'/dev/status',{method:'POST',headers:H,body:JSON.stringify({id,status})});
  const L={done:'完了にしました',blocked:'返事待ちにしました',queued:'もう一度実行します',canceled:'やめました',archived:'片付けました'};
  toast(L[status]||'変更しました');load();
}
async function togglePin(id,v){await fetch(API+'/dev/status',{method:'POST',headers:H,body:JSON.stringify({id,pinned:v})});load()}
async function cancelJob(id){await fetch(API+'/dev/cancel',{method:'POST',headers:H,body:JSON.stringify({id})});toast('中止を要求');load()}
async function sendFollowup(id){const el=document.getElementById('fu-'+id),t=el.value.trim();if(!t)return;
  await fetch(API+'/dev/followup',{method:'POST',headers:H,body:JSON.stringify({id,text:t})});el.value='';saveDraft('fu-'+id,'');toast('送りました')}
// 再読込されても書きかけが残る
(function(){const np=document.getElementById('np');if(drafts.np){np.value=drafts.np;grow(np)}})();
loadMeta();load();setInterval(load,10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script>
</body>
</html>
